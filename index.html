<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Профиль с балансом денег</title>
<style>
body {
    margin: 0;
    padding: 20px;
    font-family: 'Arial', sans-serif;
    height: 100vh;
    background-image: url("2313.png");
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    text-align: center;
    overflow: hidden;
}
.top-image {
    max-width: 200px;
    width: 100%;
    border-radius: 10px;
    margin-bottom: 30px;
}
.user-info {
    display: flex;
    align-items: center;
    font-size: 20px;
    padding: 15px 25px;
    border-radius: 15px;
    margin: 5px 0;
    max-width: 80%;
    width: fit-content;
    transition: transform 0.2s, background 0.2s;
}
.user-info:hover {
    transform: scale(1.05);
}
.icon {
    font-size: 36px;
    margin-right: 15px;
}
#nickname div:nth-child(2),
#username div:nth-child(2),
#id div:nth-child(2) {
    margin-left: 10px;
}
#nickname div:nth-child(2) {
    color: #4998ff;
}
#username div:nth-child(2) {
    color: #00ffe6;
}
#id div:nth-child(2) {
    color: #00ff9d;
}
.balance-container {
    padding: 20px;
    border-radius: 15px;
    margin-top: 5px;
    max-width: 400px;
    width: 90%;
    text-align: center;
    transition: transform 0.3s, box-shadow 0.3s, background-color 0.3s;
}
.balance-value {
    font-size: 24px;
    margin-bottom: 20px;
    color: #268002ee;
}
.back-button {
    padding: 15px 30px;
    background-color: #610000;
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-size: 20px;
    cursor: pointer;
    transition: background-color 0.3s, transform 0.2s;
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}
.back-button:hover {
    background-color: #610000a4;
    transform: translateX(calc(-50% - 10px));
}
</style>
</head>
<body>

<img src="3123.png" alt="Аватар" class="top-image" />

<div class="user-info" id="nickname">
    <div class="icon">🕴</div>
    <div>Загрузка...</div>
</div>
<div class="user-info" id="username">
    <div class="icon">👾</div>
    <div>Загрузка...</div>
</div>
<div class="user-info" id="id">
    <div class="icon">🆔</div>
    <div>Загрузка...</div>
</div>

<!-- Блок баланса -->
<div class="balance-container">
    <div class="balance-value" id="balance-display">💰 Ваш баланс: 0₽</div>
</div>

<a href="https://jdfhg321.github.io/gfdjfgk/" class="back-button">🔙 Назад</a>

<!-- Скрипты -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/supabase.min.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
    const SUPABASE_URL = 'https://vpfomvsrkxykobiziqmc.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZwZm9tdnNya3h5a29iaXppcW1jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg3NzQ1ODUsImV4cCI6MjA4NDM1MDU4NX0.7bey1hQpATp9e6jxAf7qMUwM9blpTsg_hyDT94qoQLk';
    
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);
    const tg = window.Telegram.WebApp;
    
    async function loadProfile() {
        console.log('Начинаем загрузку профиля');
    
        // Получаем параметры из URL
        const urlParams = new URLSearchParams(window.location.search);
        let userId = urlParams.get('id');
        let nickname = urlParams.get('nickname');
        let balance = urlParams.get('balance');
    
        console.log('Параметры из URL:', { userId, nickname, balance });
    
        // Если параметры не переданы, берем из tg.initDataUnsafe
        if (!userId) {
            console.log('Параметры из URL не получены, пробуем tg.initDataUnsafe');
            const user = tg.initDataUnsafe?.user;
            console.log('Данные из tg.initDataUnsafe:', user);
    
            if (user) {
                userId = user.id;
                nickname = user.first_name || user.username || 'Нет никнейма';
    
                // Загружаем баланс из базы, если его нет
                try {
                    const response = await supabaseClient
                        .from('users')
                        .select('balance')
                        .eq('id', userId)
                        .single();
    
                    console.log('Ответ базы:', response);
    
                    if (!response.error && response.data) {
                        balance = response.data.balance || 0;
                    } else {
                        balance = 0;
                    }
                } catch (error) {
                    console.error('Ошибка загрузки баланса:', error);
                    balance = 0;
                }
            } else {
                // Нет данных ниоткуда
                console.log('Нет данных ниоткуда');
                document.querySelector('#nickname div:nth-child(2)').textContent = 'Нет данных';
                document.querySelector('#username div:nth-child(2)').textContent = '';
                document.querySelector('#id div:nth-child(2)').textContent = '';
                document.getElementById('balance-display').innerHTML = '💰 Ваш баланс: 0₽';
                return;
            }
        }
    
        console.log('Итоговые данные:', { userId, nickname, balance });
    
        // Обновляем DOM
        document.querySelector('#nickname div:nth-child(2)').textContent = nickname || 'Нет никнейма';
        document.querySelector('#username div:nth-child(2)').textContent = '@N/A';
        document.querySelector('#id div:nth-child(2)').textContent = 'ID TG: ' + userId;
        document.getElementById('balance-display').innerHTML = '💰 Ваш баланс: <span style="font-size:24px;">' + balance + '₽</span>';
    }
    
    // Запускаем после полной загрузки DOM
    window.addEventListener('DOMContentLoaded', loadProfile);
    
    // Запрет зума
    window.addEventListener("wheel", e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
    window.addEventListener("keydown", e => { if (e.ctrlKey) e.preventDefault(); });
    </script>
</body>
</html>
